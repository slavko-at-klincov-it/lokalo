name: Lokalo
options:
  bundleIdPrefix: it.klincov
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "26.4"

packages:
  USearch:
    url: https://github.com/unum-cloud/usearch
    from: 2.21.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.2
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: 0.11.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    OTHER_LDFLAGS: -lc++

targets:
  Lokalo:
    type: application
    platform: iOS
    sources:
      - path: Lokalo
        excludes:
          - "**/.DS_Store"
          - "Resources/**"
      - path: Lokalo/Resources
        buildPhase: resources
    resources:
      - path: Lokalo/Assets.xcassets
        type: folder
    info:
      path: Lokalo/Info.plist
      properties:
        CFBundleDisplayName: Lokalo
        CFBundleName: Lokalo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "12"
        UILaunchScreen:
          UIColorName: ""
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        BGTaskSchedulerPermittedIdentifiers:
          - it.klincov.lokalo.ragindex
        UIBackgroundModes:
          - processing
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Lokalo nutzt das Mikrofon für Sprachsteuerung und Diktat – dein Audio verlässt das Gerät nie."
        NSSpeechRecognitionUsageDescription: "Lokalo nutzt Spracheingabe für Diktat – die Erkennung läuft vollständig auf dem Gerät."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            huggingface.co:
              NSIncludesSubdomains: true
              NSTemporaryExceptionAllowsInsecureHTTPLoads: false
              NSTemporaryExceptionMinimumTLSVersion: TLSv1.2
        CFBundleURLTypes:
          - CFBundleURLName: it.klincov.lokalo.oauth
            CFBundleURLSchemes:
              - it.klincov.lokalo
    entitlements:
      path: Lokalo/Lokalo.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.klincov.lokalo
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: SMPDFBGL64
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        CURRENT_PROJECT_VERSION: "12"
        MARKETING_VERSION: "1.0"
        FRAMEWORK_SEARCH_PATHS:
          - $(PROJECT_DIR)/Frameworks
        OTHER_LDFLAGS:
          - -lc++
          - -framework
          - Accelerate
          - -framework
          - Metal
          - -framework
          - MetalKit
          - -framework
          - Foundation
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
        codeSign: true
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - package: USearch
      - package: KeychainAccess
      - package: MCP

  LokaloTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LokaloTests]
    dependencies:
      - target: Lokalo
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lokalo.app/Lokalo

  LokaloUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LokaloUITests]
    dependencies:
      - target: Lokalo
    settings:
      base:
        TEST_TARGET_NAME: Lokalo
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: it.klincov.lokalo.uitests
